<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Sterling Style Hero</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #060814;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      /* The blueprint cyber-grid pattern */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      background-position: center;
    }

    #tsparticles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
  </style>
</head>
<body>

  <div class="hero">
    <div id="tsparticles"></div>
    <h2>Hello</h2>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tsparticles/2.12.0/tsparticles.bundle.min.js"></script>

  <script>
    tsParticles.load("tsparticles", {
      fpsLimit: 120,
      interactivity: {
        events: {
          onHover: {
            enable: true,
            mode: "attract" /* Pulls nodes towards the mouse cursor */
          },
          resize: true
        },
        modes: {
          attract: {
            distance: 200,
            duration: 0.4,
            factor: 5 /* Strength of the magnetic pull */
          }
        }
      },
      particles: {
        /* Color rotation matching the screenshot (Purples, Cyans, Emeralds) */
        color: {
          value: ["#a855f7", "#06b6d4", "#10b981", "#6366f1"]
        },
        links: {
          color: "#ffffff",
          distance: 120,
          enable: true,
          opacity: 0.1,
          width: 1
        },
        move: {
          direction: "none",
          enable: true,
          outModes: {
            default: "out"
          },
          random: true,
          speed: 0.8,
          straight: false
        },
        number: {
          density: {
            enable: true,
            area: 600
          },
          value: 90
        },
        opacity: {
          value: { min: 0.2, max: 0.6 }
        },
        shape: {
          type: "circle"
        },
        size: {
          value: { min: 1.5, max: 3.5 }
        }
      },
      detectRetina: true
    });
  </script>
</body>
</html>
